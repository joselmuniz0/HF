name: Build HF Coach APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'fix/android-lift-selector', 'feature/ui-system-argentina']
    paths:
      - 'HF-Coach-Android-Source.zip'
      - '.central-source/**'
      - 'scripts/extract-central-overlay.sh'
      - 'scripts/patch-central-stage2.mjs'
      - 'scripts/patch-central-stage3.mjs'
      - 'scripts/patch-central-stage4.mjs'
      - 'scripts/patch-central-video-analysis.mjs'
      - 'scripts/central-video-analysis-runtime.js'
      - 'scripts/patch-android-stage4.mjs'
      - 'scripts/patch-android-athlete-registration.mjs'
      - 'scripts/patch-android-runtime-quality.mjs'
      - 'scripts/patch-android-athlete-planning.mjs'
      - 'scripts/patch-android-jerk-analysis.mjs'
      - 'scripts/validate-android-lift-selector.mjs'
      - 'scripts/patch-android-build-identity.mjs'
      - 'scripts/patch-android-service-worker.mjs'
      - 'scripts/patch-android-central-cache.mjs'
      - 'android/signing/**'
      - 'scripts/build-central-config.mjs'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'docs/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify and extract source archive
        run: |
          test -f HF-Coach-Android-Source.zip
          echo "ae1afa34a074b78a407522016cf614d04dfabe2bd2c7c64b7a305f02d61eeab3  HF-Coach-Android-Source.zip" | sha256sum --check
          mkdir -p app-source
          unzip -q HF-Coach-Android-Source.zip -d app-source
          test -f app-source/package.json
          test -f app-source/capacitor.config.json
      - name: Apply dedicated Jerk video analysis
        run: node scripts/patch-android-jerk-analysis.mjs app-source/src/index.html
      - name: Validate inline JavaScript and exact lift selector
        working-directory: app-source
        run: |
          node ../scripts/validate-android-lift-selector.mjs src/index.html
          node <<'NODE'
          const fs = require('fs');
          const os = require('os');
          const path = require('path');
          const { spawnSync } = require('child_process');
          const html = fs.readFileSync('src/index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s+type="module")?>([\s\S]*?)<\/script>/g)];
          if (!scripts.length) throw new Error('No inline JavaScript scripts found.');
          scripts.forEach((match, i) => {
            const p = path.join(os.tmpdir(), 'hf-coach-inline-' + i + '.mjs');
            fs.writeFileSync(p, match[1]);
            const check = spawnSync(process.execPath, ['--check', p], {encoding:'utf8'});
            if (check.status !== 0) throw new Error(check.stderr || 'JS syntax check failed');
          });
          console.log('Inline JavaScript syntax checks passed.');
          NODE
      - name: Validate HF Central video-analysis runtime syntax
        run: node --check scripts/central-video-analysis-runtime.js
      - name: Reconstruct and apply HF Central overlay
        run: |
          bash scripts/extract-central-overlay.sh
          cp .hf-central/platform/app-overlay/reports.js app-source/src/reports.js
          node .hf-central/platform/app-overlay/inject-reports.mjs app-source/src/index.html
      - name: Patch native video loading for Android WebView
        run: |
          node <<'NODE'
          const fs = require('fs');

          const nativePath = 'app-source/src/native.js';
          let native = fs.readFileSync(nativePath, 'utf8');
          if (!native.includes('async prepareVideoFile(file)')) {
            const marker = '  async preparePrivateFolder() {';
            if (!native.includes(marker)) throw new Error('No encuentro el punto de inserción en native.js.');
            const method = [
              '  async prepareVideoFile(file) {',
              '    if (!Capacitor.isNativePlatform()) return URL.createObjectURL(file);',
              '    if (!file || !file.size) throw new Error("El archivo de video está vacío.");',
              '    if (file.size > 100 * 1024 * 1024) throw new Error("El video supera 100 MB. Recortalo o reducí su resolución antes de analizarlo.");',
              '    const data = await new Promise((resolve, reject) => {',
              '      const reader = new FileReader();',
              '      reader.onload = () => {',
              '        const value = String(reader.result || "");',
              '        const comma = value.indexOf(",");',
              '        if (comma < 0) return reject(new Error("No se pudo leer el video seleccionado."));',
              '        resolve(value.slice(comma + 1));',
              '      };',
              '      reader.onerror = () => reject(reader.error || new Error("Falló la lectura del video."));',
              '      reader.readAsDataURL(file);',
              '    });',
              '    const safeName = String(file.name || "video.mp4").replace(/[^a-z0-9._-]/gi, "_").slice(-80);',
              '    const path = "hfcoach-video-" + Date.now() + "-" + safeName;',
              '    const saved = await Filesystem.writeFile({ path, directory: Directory.Cache, data, recursive: true });',
              '    const previousPath = window.HFNativeVideoPath;',
              '    window.HFNativeVideoPath = path;',
              '    if (previousPath) {',
              '      try { await Filesystem.deleteFile({ path: previousPath, directory: Directory.Cache }); } catch (_) {}',
              '    }',
              '    return Capacitor.convertFileSrc(saved.uri);',
              '  },',
              ''
            ].join('\n');
            native = native.replace(marker, method + marker);
            fs.writeFileSync(nativePath, native);
          }

          const htmlPath = 'app-source/src/index.html';
          let html = fs.readFileSync(htmlPath, 'utf8');
          const oldChange = '$("#f").onchange=e=>{const f=e.target.files[0];if(!f)return;selectedVideoFile=f;window.HFCurrentVideo=f;window.HFTrack("video_selected",{type:f.type||"unknown",size_bytes:f.size});vid.src=URL.createObjectURL(f);$("#go").disabled=false;$("#st").textContent="Video cargado.";$("#out").innerHTML=""};';
          const newChange = [
            '$("#f").onchange=async e=>{',
            '  const f=e.target.files[0];if(!f)return;',
            '  if(f.size>100*1024*1024){$("#st").textContent="El video supera 100 MB. Recortalo o reducí su resolución.";e.target.value="";return;}',
            '  selectedVideoFile=f;window.HFCurrentVideo=f;window.HFTrack("video_selected",{type:f.type||"unknown",size_bytes:f.size});',
            '  $("#go").disabled=true;$("#st").textContent="Preparando el video para análisis local…";$("#out").innerHTML="";',
            '  try{',
            '    const native=window.HFNative;',
            '    if(!native)throw new Error("El módulo de almacenamiento Android todavía no está disponible. Cerrá y volvé a abrir la aplicación.");',
            '    const source=native.isNative?await native.prepareVideoFile(f):URL.createObjectURL(f);',
            '    vid.removeAttribute("crossorigin");vid.src=source;vid.load();',
            '    await new Promise((resolve,reject)=>{',
            '      if(vid.readyState>=1)return resolve();',
            '      const cleanup=()=>{clearTimeout(timer);vid.removeEventListener("loadedmetadata",ready);vid.removeEventListener("error",fail);};',
            '      const ready=()=>{cleanup();resolve();};',
            '      const fail=()=>{cleanup();reject(new Error("Android no pudo abrir este video. Probá con MP4 H.264."));};',
            '      const timer=setTimeout(()=>{cleanup();reject(new Error("El video tardó demasiado en abrirse."));},15000);',
            '      vid.addEventListener("loadedmetadata",ready,{once:true});vid.addEventListener("error",fail,{once:true});',
            '    });',
            '    $("#go").disabled=false;$("#st").textContent="Video cargado. Listo para analizar."; ',
            '  }catch(err){$("#st").textContent="No se pudo preparar el video: "+(err.message||err);}',
            '};'
          ].join('\n');
          if (html.includes(oldChange)) {
            html = html.replace(oldChange, newChange);
          } else if (!html.includes('native.prepareVideoFile(f)')) {
            throw new Error('No encuentro el selector de video esperado en index.html.');
          }
          html = html.replace('vid.crossOrigin="anonymous";vid.setAttribute("crossorigin","anonymous");', '');
          const oldLandmarker = 'lm=await PoseLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:M},runningMode:"VIDEO",numPoses:1})';
          const cpuLandmarker = 'lm=await PoseLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:M,delegate:"CPU"},runningMode:"VIDEO",numPoses:1})';
          if (html.includes(oldLandmarker)) {
            html = html.replace(oldLandmarker, cpuLandmarker);
          } else if (!html.includes('delegate:"CPU"')) {
            throw new Error('No encuentro la inicialización del modelo PoseLandmarker esperada.');
          }
          fs.writeFileSync(htmlPath, html);
          console.log('Android video source now uses app-private storage and a same-origin Capacitor URL; MediaPipe CPU delegate selected.');
          NODE
      - name: Add shared HF Central access inside Android app
        run: node scripts/patch-android-stage4.mjs
      - name: Force refresh of embedded HF Central
        run: node scripts/patch-android-central-cache.mjs app-source/src/index.html "$GITHUB_SHA"
      - name: Unify Android athlete registration with HF Central
        run: node scripts/patch-android-athlete-registration.mjs
      - name: Apply Android runtime compatibility and cross-device refresh
        run: node scripts/patch-android-runtime-quality.mjs
      - name: Make local HTML network-first and static assets cache-first
        run: node scripts/patch-android-service-worker.mjs
      - name: Validate patched service worker source
        run: node scripts/patch-android-service-worker.mjs --validate app-source/src/public/sw.js
      - name: Add published training plan viewer to Android athlete roster
        run: node scripts/patch-android-athlete-planning.mjs
      - name: Inject build identity into local Android UI
        run: node scripts/patch-android-build-identity.mjs app-source/src/index.html
      - name: Final source validation after all patches
        run: node scripts/validate-android-lift-selector.mjs app-source/src/index.html
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install dependencies
        working-directory: app-source
        run: npm install --no-audit --no-fund
      - name: Build web application
        working-directory: app-source
        run: npm run build
      - name: Write build metadata into web assets
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const out = 'app-source/www/build-info.json';
          fs.mkdirSync(path.dirname(out), {recursive:true});
          fs.writeFileSync(out, JSON.stringify({
            appVersion: '1.0.' + process.env.GITHUB_RUN_NUMBER,
            runNumber: Number(process.env.GITHUB_RUN_NUMBER),
            commit: process.env.GITHUB_SHA,
            commitShort: process.env.GITHUB_SHA.slice(0,7),
            branch: process.env.GITHUB_REF_NAME,
            builtAt: new Date().toISOString()
          }, null, 2) + String.fromCharCode(10));
          NODE
      - name: Validate built web HTML
        run: node scripts/validate-android-lift-selector.mjs app-source/www/index.html
      - name: Validate built web service worker
        run: node scripts/patch-android-service-worker.mjs --validate app-source/www/sw.js
      - name: Generate Android project
        working-directory: app-source
        run: npx cap add android
      - name: Sync Capacitor
        working-directory: app-source
        run: npx cap sync android
      - name: Validate Android packaged HTML
        run: node scripts/validate-android-lift-selector.mjs app-source/android/app/src/main/assets/public/index.html
      - name: Validate Android packaged service worker
        run: node scripts/patch-android-service-worker.mjs --validate app-source/android/app/src/main/assets/public/sw.js
      - name: Install stable pilot debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode android/signing/debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
      - name: Configure explicit pilot debug signing and app version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          gradle = Path("app-source/android/app/build.gradle")
          source = gradle.read_text()

          run_number = os.environ.get("GITHUB_RUN_NUMBER", "1")
          if not run_number.isdigit():
              raise SystemExit("GITHUB_RUN_NUMBER no es numérico.")
          version_code = int(run_number)
          source, version_code_count = re.subn(
              r'(?m)^\s*versionCode\s+\d+\s*$',
              f'        versionCode {version_code}',
              source,
              count=1
          )
          source, version_name_count = re.subn(
              r'(?m)^\s*versionName\s+"[^"]+"\s*$',
              f'        versionName "1.0.{version_code}"',
              source,
              count=1
          )
          if version_code_count != 1 or version_name_count != 1:
              raise SystemExit("No se pudieron actualizar versionCode/versionName.")

          android = re.search(r'(?m)^(\s*)android\s*\{', source)
          if not android:
              raise SystemExit("No se encontró el bloque android en app/build.gradle")
          child = android.group(1) + "    "

          if "signingConfigs.pilotDebug" not in source:
              signing_config = """
          signingConfigs {
              pilotDebug {
                  storeFile file(System.getenv("HOME") + "/.android/debug.keystore")
                  storePassword "android"
                  keyAlias "androiddebugkey"
                  keyPassword "android"
              }
          }
          """
              signing_config = "\n".join(child + line if line else "" for line in signing_config.strip("\n").split("\n")) + "\n"
              source = source[:android.end()] + "\n" + signing_config + source[android.end():]

          build_types = re.search(r'(?m)^(\s*)buildTypes\s*\{', source)
          if not build_types:
              raise SystemExit("No se encontró buildTypes en app/build.gradle")
          inner = build_types.group(1) + "    "
          tail = source[build_types.end():]
          close = re.search(r'(?m)^' + re.escape(build_types.group(1)) + r'\}', tail)
          if not close:
              raise SystemExit("No se pudo delimitar buildTypes")
          block = tail[:close.start()]
          debug = re.search(r'(?m)^\s*debug\s*\{', block)

          if debug:
              debug_indent = re.match(r'\s*', debug.group(0)).group(0) + "    "
              if "signingConfig signingConfigs.pilotDebug" not in block[debug.start():]:
                  at = build_types.end() + debug.end()
                  source = source[:at] + "\n" + debug_indent + "signingConfig signingConfigs.pilotDebug" + source[at:]
          else:
              release = re.search(r'(?m)^\s*release\s*\{', block)
              debug_block = "\n" + inner + "debug {\n" + inner + "    signingConfig signingConfigs.pilotDebug\n" + inner + "}\n"
              at = build_types.end() + (release.start() if release else 0)
              source = source[:at] + debug_block + source[at:]

          gradle.write_text(source)
          print(f"Gradle pilot debug signing configured; versionCode={version_code}, versionName=1.0.{version_code}.")
          PY
      - name: Build debug APK
        working-directory: app-source/android
        run: ./gradlew --no-daemon assembleDebug
      - name: Verify stable pilot APK signature
        working-directory: app-source/android
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          CERT="$(keytool -printcert -jarfile "$APK" | awk -F': ' '/SHA256:/ {gsub(/:/, "", $2); print tolower($2); exit}')"
          EXPECTED="dfc7a28540222fa9b953608717653afbaf540a4a2c9648d4aa0141a6b07a85b7"
          echo "APK certificate SHA-256: $CERT"
          test "$CERT" = "$EXPECTED" || { echo "APK no está firmado con la clave estable del piloto."; exit 1; }
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HF-Coach-debug-apk
          path: |
            app-source/android/app/build/outputs/apk/debug/app-debug.apk
            app-source/www/build-info.json
            app-source/android/app/src/main/assets/public/build-info.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload HF Central setup package
        uses: actions/upload-artifact@v4
        with:
          name: HF-Central-Setup
          path: .hf-central/
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
